name: OSaaS My Apps Keep-Alive

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          npm install -g @osaas/cli
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Keep-Alive
        env:
          OSC_ACCESS_TOKEN: ${{ secrets.OSC_ACCESS_TOKEN }}
          # 强烈建议：浏览器登录后的 Cookie，用于真正打开控制台并点 Resume
          OSC_SESSION_COOKIE: ${{ secrets.OSC_SESSION_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OSAAS_APP_NAMES: ${{ vars.OSAAS_APP_NAMES || 'zdsa' }}
          OSAAS_APP_URL: ${{ vars.OSAAS_APP_URL || 'https://d5a4f3bcdd.apps.osaas.io' }}
        run: |
          chmod +x scripts/keep-alive.sh
          ./scripts/keep-alive.sh
